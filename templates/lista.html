{% extends "template.html" %}
{% block conteudo %}
<div class="d-flex justify-content-center gap-2">
    <a class="btn btn-success" href="{{ url_for('cadastro') }}">Cadastro</a>
    <a class="btn btn-primary" href="{{ url_for('login') }}">Login</a>
    <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
    <a class="btn btn-primary" href="{{ url_for('novo') }}">Novo Jogo</a>
</div>

<table class="table table-striped table-responsive table-bordered">
    <thead class="thead-default">
        <tr>
            <th class="text-center">Nome</th>
            <th class="text-center">Categoria</th>
            <th class="text-center">Console</th>
            <th class="text-center">Opções</th>
        </tr>
    </thead>
    <tbody>
        
        {% for jogo in jogos %}
        <tr>
            <td class="text-center align-middle">{{ jogo.nome }}</td>
            <td class="text-center align-middle">{{ jogo.categoria }}</td>
            <td class="text-center align-middle">{{ jogo.console }}</td>
            <td class="text-center align-middle">
                <a class="btn btn-warning" href="{{ url_for('editar', id=jogo.id) }}">Editar</a>
                <a class="btn btn-danger" href="{{ url_for('deletar', id=jogo.id) }}">Deletar</a>
            </td>
        </tr>
        {% endfor %}

    </tbody>
</table>
{% endblock %}
